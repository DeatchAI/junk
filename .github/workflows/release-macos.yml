name: Release Detach for macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.3.4"
        required: true
        type: string
      build:
        description: "Optional numeric build number; leave blank to use the workflow run number"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: detach-macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://qymrzmmsroxkteaxbgoo.supabase.co
      SUPABASE_UPDATES_BUCKET: updates
      DETACH_UPDATE_BASE_URL: https://qymrzmmsroxkteaxbgoo.supabase.co/storage/v1/object/public/updates

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Import the Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/detach-signing.keychain-db"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Prepare App Store Connect notarization key
        shell: bash
        run: |
          set -euo pipefail
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode -o "$notary_key"
          chmod 600 "$notary_key"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Run runtime checks
        working-directory: server-v2
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit

      - name: Determine release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
            tag="v$version"
          fi
          build="${{ inputs.build }}"
          if [[ -z "$build" ]]; then
            build="$((1000 + GITHUB_RUN_NUMBER))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive, notarize, package, sign, and publish
        run: |
          bash scripts/release.sh \
            --version "${{ steps.release.outputs.version }}" \
            --build "${{ steps.release.outputs.build }}" \
            --notary-key "$APPLE_NOTARY_KEY_PATH" \
            --notary-key-id "$APPLE_NOTARY_KEY_ID" \
            --notary-issuer-id "$APPLE_NOTARY_ISSUER_ID" \
            --output "dist/release-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}" \
            --publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          dmg="dist/release-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}/Detach-${{ steps.release.outputs.version }}.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" --clobber
          else
            gh release create "$tag" "$dmg" --target "$GITHUB_SHA" --title "Detach ${{ steps.release.outputs.version }}" --generate-notes
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: detach-${{ steps.release.outputs.version }}
          path: |
            dist/release-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}/Detach-${{ steps.release.outputs.version }}.dmg
            dist/release-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}/appcast.xml
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/detach-signing.keychain-db" || true
