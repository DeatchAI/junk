name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift and TypeScript
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript, swift
          build-mode: manual
      - name: Build Swift sources for analysis
        run: |
          xcodebuild \
            -project app/detach.xcodeproj \
            -scheme lazzy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: github/codeql-action/analyze@v4.37.4
