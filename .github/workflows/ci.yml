name: Pull request checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server-v2
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install runtime dependencies
        working-directory: app/server-v2
        run: bun install --frozen-lockfile
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Verify privacy logger redaction
        run: |
          swiftc app/lazzy/Core/Logging/PrivacyLogger.swift app/scripts/PrivacyLoggerCheck.swift -o "$RUNNER_TEMP/privacy-logger-check"
          "$RUNNER_TEMP/privacy-logger-check"
      - name: Build without signing
        run: |
          xcodebuild \
            -project app/detach.xcodeproj \
            -scheme lazzy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
