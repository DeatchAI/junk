name: Bug report
description: Report a reproducible problem in Detach.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Detach. Do not include credentials, private files, or security-sensitive details.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...\n2. ...\n3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Detach version or commit
  - type: textarea
    id: environment
    attributes:
      label: macOS version and relevant environment details
